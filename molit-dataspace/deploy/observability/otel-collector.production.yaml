extensions:
  file_storage:
    directory: /var/lib/otelcol/queue
    create_directory: true
    fsync: true
  health_check:
    endpoint: 0.0.0.0:13133
    check_collector_pipeline:
      enabled: true
      interval: 5s
      exporter_failure_threshold: 3
  bearertokenauth/upstream:
    filename: /run/secrets/upstream_token
  bearertokenauth/ingress:
    filename: /run/secrets/ingress_token
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/ingress
        tls:
          cert_file: /run/secrets/otel_server_cert
          key_file: /run/secrets/otel_server_key
          client_ca_file: /run/secrets/otel_client_ca
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  attributes/security:
    actions:
      - key: authorization
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: db.statement
        action: delete
      - key: enduser.id
        action: delete
      - key: molit.tenant_id
        action: delete
  batch:
    send_batch_size: 1024
    timeout: 2s
exporters:
  otlphttp/upstream:
    endpoint: ${env:UPSTREAM_OTLP_ENDPOINT}
    auth:
      authenticator: bearertokenauth/upstream
    tls:
      ca_file: /run/secrets/upstream_ca
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 20000
      block_on_overflow: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
service:
  extensions: [file_storage, health_check, bearertokenauth/upstream, bearertokenauth/ingress]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/security, batch]
      exporters: [otlphttp/upstream]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/security, batch]
      exporters: [otlphttp/upstream]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/security]
      exporters: [otlphttp/upstream]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: false
                without_units: false
