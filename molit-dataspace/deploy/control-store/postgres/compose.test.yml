services:
  postgres:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    platform: linux/amd64
    environment:
      POSTGRES_DB: molit_control_store_test
      POSTGRES_PASSWORD: molit-control-store-test
      POSTGRES_USER: molit_control_store_test
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -d -m 700 -o postgres -g postgres /var/lib/postgresql/tls
        install -m 644 -o postgres -g postgres /test-tls/server-one.crt /var/lib/postgresql/tls/server.crt
        install -m 600 -o postgres -g postgres /test-tls/server-one.key /var/lib/postgresql/tls/server.key
        install -m 644 -o postgres -g postgres /test-tls/root.crt /var/lib/postgresql/tls/root.crt
        exec /usr/local/bin/docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/tls/server.crt \
          -c ssl_key_file=/var/lib/postgresql/tls/server.key \
          -c ssl_ca_file=/var/lib/postgresql/tls/root.crt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molit_control_store_test -d molit_control_store_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1::5432"
    volumes:
      - ../../../tests/fixtures/identity-tls:/test-tls:ro
    tmpfs:
      - /var/lib/postgresql/data
