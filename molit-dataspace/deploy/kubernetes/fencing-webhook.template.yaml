apiVersion: v1
kind: ServiceAccount
metadata:
  name: molit-caas-fencing-webhook
  namespace: molit-caas-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: molit-caas-fencing-webhook
  namespace: molit-caas-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: molit-caas-fencing-webhook
  namespace: molit-caas-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: molit-caas-fencing-webhook
subjects:
  - kind: ServiceAccount
    name: molit-caas-fencing-webhook
    namespace: molit-caas-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: molit-caas-fencing-webhook
  namespace: molit-caas-system
  labels:
    app.kubernetes.io/name: molit-caas-fencing-webhook
    app.kubernetes.io/managed-by: molit-caas-bootstrap
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: molit-caas-fencing-webhook
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: molit-caas-fencing-webhook
        app.kubernetes.io/managed-by: molit-caas-bootstrap
      annotations:
        caas.data.molit.go.kr/tls-sha256: __TLS_SHA256__
    spec:
      serviceAccountName: molit-caas-fencing-webhook
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: molit-caas-fencing-webhook }
        - maxSkew: 1
          minDomains: 3
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: molit-caas-fencing-webhook }
      containers:
        - name: webhook
          image: __WEBHOOK_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: MOLIT_FENCING_TLS_CERT_FILE
              value: /var/run/molit/tls/tls.crt
            - name: MOLIT_FENCING_TLS_KEY_FILE
              value: /var/run/molit/tls/tls.key
            - name: MOLIT_FENCING_CONTROL_NAMESPACE
              value: molit-caas-system
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: tls
              mountPath: /var/run/molit/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: molit-caas-fencing-webhook-tls
            defaultMode: 288
---
apiVersion: v1
kind: Service
metadata:
  name: molit-caas-fencing-webhook
  namespace: molit-caas-system
spec:
  selector:
    app.kubernetes.io/name: molit-caas-fencing-webhook
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: molit-caas-fencing-webhook
  namespace: molit-caas-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: molit-caas-fencing-webhook
