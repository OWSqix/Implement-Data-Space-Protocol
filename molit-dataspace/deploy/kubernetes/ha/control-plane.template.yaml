              path: /healthz
              port: https
              scheme: HTTPS
              httpHeaders: [{ name: Host, value: "@@DSAAS_HEALTH_HOST@@" }]
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
              httpHeaders: [{ name: Host, value: "@@DSAAS_HEALTH_HOST@@" }]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
              httpHeaders: [{ name: Host, value: "@@DSAAS_HEALTH_HOST@@" }]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: runtime-config, mountPath: /run/molit/dsaas, readOnly: true }
            - { name: identity-config, mountPath: /run/molit/identity, readOnly: true }
            - { name: identity-secret, mountPath: /var/run/secrets/molit-identity, readOnly: true }
            - { name: observability-config, mountPath: /run/molit/observability, readOnly: true }
            - { name: observability-secret, mountPath: /var/run/secrets/molit-observability, readOnly: true }
            - { name: inbound-tls, mountPath: /var/run/secrets/molit-inbound, readOnly: true }
            - { name: caas-client, mountPath: /var/run/secrets/molit-caas-client, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: runtime-config
          secret: { secretName: molit-dsaas-runtime-config, defaultMode: 288 }
        - name: identity-config
          configMap: { name: molit-identity-config, defaultMode: 288 }
        - name: identity-secret
          secret: { secretName: molit-identity, defaultMode: 288 }
        - name: observability-config
          configMap: { name: molit-observability-config, defaultMode: 288 }
        - name: observability-secret
          secret: { secretName: molit-observability, defaultMode: 288 }
        - name: inbound-tls
          secret: { secretName: molit-dsaas-tls, defaultMode: 288 }
        - name: caas-client
          secret: { secretName: molit-caas-client, defaultMode: 288 }
        - name: schema-receipt
          configMap: { name: molit-control-store-schema-receipt, defaultMode: 288 }
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
