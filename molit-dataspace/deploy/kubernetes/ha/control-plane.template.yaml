          labelSelector:
            matchLabels: { app.kubernetes.io/name: molit-dsaas }
      initContainers:
        - name: production-preflight
          image: "@@DSAAS_IMAGE@@"
          imagePullPolicy: IfNotPresent
          command: ["node", "src/operations/kubernetes-preflight.mjs"]
          args: ["--runtime", "/run/molit/dsaas/dsaas.json", "--schema-receipt", "/run/molit/control-store/receipt.json", "--service", "dsaas"]
          envFrom:
