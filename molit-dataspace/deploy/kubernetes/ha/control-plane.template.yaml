apiVersion: v1
kind: ServiceAccount
metadata:
  name: molit-dsaas
  namespace: molit-caas-system
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: molit-system-default-deny, namespace: molit-caas-system }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: molit-system-internal, namespace: molit-caas-system }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: otel-collector } }
      ports: [{ protocol: TCP, port: 4318 }]
    - ports: [{ protocol: TCP, port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: molit-dsaas-public-ingress, namespace: molit-caas-system }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: molit-dsaas } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{ protocol: TCP, port: 8888 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: molit-fencing-webhook-apiserver-ingress, namespace: molit-caas-system }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: molit-caas-fencing-webhook } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports: [{ protocol: TCP, port: 8443 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: molit-caas
  namespace: molit-caas-system
  labels:
    app.kubernetes.io/name: molit-caas
    app.kubernetes.io/part-of: molit-control-plane
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: molit-caas }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: molit-caas
        app.kubernetes.io/part-of: molit-control-plane
      annotations:
        caas.data.molit.go.kr/configuration-sha256: "@@CAAS_CONFIGURATION_SHA256@@"
    spec:
      serviceAccountName: molit-caas-controller
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: molit-caas }
        - maxSkew: 1
          minDomains: 3
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: molit-caas }
      initContainers:
        - name: production-preflight
          image: "@@CAAS_IMAGE@@"
          imagePullPolicy: IfNotPresent
          command: ["node", "src/operations/kubernetes-preflight.mjs"]
          args: ["--runtime", "/run/molit/caas.json", "--schema-receipt", "/run/molit/control-store/receipt.json", "--service", "caas"]
          envFrom:
            - secretRef: { name: molit-control-plane-runtime }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: runtime-config, mountPath: /run/molit/caas.json, subPath: caas.json, readOnly: true }
            - { name: identity-config, mountPath: /run/molit/identity, readOnly: true }
            - { name: identity-secret, mountPath: /var/run/secrets/molit-identity, readOnly: true }
            - { name: observability-config, mountPath: /run/molit/observability, readOnly: true }
            - { name: observability-secret, mountPath: /var/run/secrets/molit-observability, readOnly: true }
            - { name: inbound-tls, mountPath: /var/run/secrets/molit-inbound, readOnly: true }
            - { name: schema-receipt, mountPath: /run/molit/control-store, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: caas
          image: "@@CAAS_IMAGE@@"
          imagePullPolicy: IfNotPresent
          args: ["--config", "/run/molit/caas.json"]
          envFrom:
            - secretRef: { name: molit-control-plane-runtime }
          env:
            - name: MOLIT_CAAS_HOLDER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports: [{ name: https, containerPort: 8787, protocol: TCP }]
          startupProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: runtime-config, mountPath: /run/molit/caas.json, subPath: caas.json, readOnly: true }
            - { name: identity-config, mountPath: /run/molit/identity, readOnly: true }
            - { name: identity-secret, mountPath: /var/run/secrets/molit-identity, readOnly: true }
            - { name: observability-config, mountPath: /run/molit/observability, readOnly: true }
            - { name: observability-secret, mountPath: /var/run/secrets/molit-observability, readOnly: true }
            - { name: inbound-tls, mountPath: /var/run/secrets/molit-inbound, readOnly: true }
            - { name: kubernetes-api-identity, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: runtime-config
          secret: { secretName: molit-caas-runtime-config, defaultMode: 288 }
        - name: identity-config
          configMap: { name: molit-identity-config, defaultMode: 288 }
        - name: identity-secret
          secret: { secretName: molit-identity, defaultMode: 288 }
        - name: observability-config
          configMap: { name: molit-observability-config, defaultMode: 288 }
        - name: observability-secret
          secret: { secretName: molit-observability, defaultMode: 288 }
        - name: inbound-tls
          secret: { secretName: molit-caas-tls, defaultMode: 288 }
        - name: kubernetes-api-identity
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: ca.crt }]
        - name: schema-receipt
          configMap: { name: molit-control-store-schema-receipt, defaultMode: 288 }
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
---
