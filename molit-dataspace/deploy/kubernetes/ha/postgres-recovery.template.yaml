apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: "@@RECOVERY_CLUSTER_NAME@@"
  namespace: molit-caas-system
  labels:
    app.kubernetes.io/managed-by: molit-platform-recovery
    data.molit.go.kr/recovery-source: molit-control-store
spec:
  instances: 3
  imageName: "@@POSTGRES_IMAGE@@"
  primaryUpdateStrategy: unsupervised
  affinity:
    enablePodAntiAffinity: true
    topologyKey: topology.kubernetes.io/zone
    podAntiAffinityType: required
  storage:
    storageClass: "@@STORAGE_CLASS@@"
    size: 100Gi
  walStorage:
    storageClass: "@@STORAGE_CLASS@@"
    size: 20Gi
  postgresql:
    parameters:
      synchronous_commit: "on"
      wal_compression: "on"
    synchronous:
      method: any
      number: 1
      dataDurability: required
      failoverQuorum: true
  managed:
    roles:
      - name: "@@CAAS_DATABASE_ROLE@@"
        ensure: present
        login: false
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        replication: false
        bypassrls: false
        passwordSecret: { name: molit-caas-database-role }
      - name: "@@DSAAS_DATABASE_ROLE@@"
        ensure: present
        login: false
        superuser: false
        createdb: false
        createrole: false
        inherit: false
        replication: false
        bypassrls: false
        passwordSecret: { name: molit-dsaas-database-role }
  bootstrap:
    recovery:
      source: molit-control-store-backup-source
      recoveryTarget:
        targetTime: "@@RECOVERY_TARGET_TIME@@"
  externalClusters:
    - name: molit-control-store-backup-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: molit-control-store-backup
          serverName: molit-control-store
