edc.participant.id=provider
edc.component.id=provider-data-plane

web.http.port=8080
web.http.path=/api
web.http.control.port=8083
web.http.control.path=/control
web.http.public.port=8084
web.http.public.path=/public
edc.control.endpoint=http://provider-data-plane:8083/control
edc.dpf.selector.url=http://provider-control-plane:8083/control/v1/dataplanes

edc.transfer.proxy.token.signer.privatekey.alias=private-key
edc.transfer.proxy.token.verifier.publickey.alias=public-key
edc.iam.publickeys.smoke.id=public-key
edc.iam.publickeys.smoke.path=/run/edc-keys/public.pem
edc.dataplane.proxy.public.endpoint=http://provider-data-plane:8084/public
edc.molit.smoke.enabled=true
edc.molit.smoke.keystore.path=/run/edc-keys/keystore.p12
edc.molit.smoke.keystore.password.path=/run/edc-keys/password
edc.molit.smoke.keystore.alias=smoke-key

edc.dataplane.http.sink.partition.size=1
edc.dataplane.send.retry.limit=3
edc.dataplane.state-machine.iteration-wait-millis=100

edc.datasource.default.url=jdbc:postgresql://postgres:5432/provider_dp
edc.datasource.default.user=edc
edc.datasource.default.driverClassName=org.postgresql.Driver
edc.sql.schema.autocreate=true
