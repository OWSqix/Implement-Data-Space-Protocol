edc.participant.id=consumer
edc.component.id=consumer-control-plane
edc.dsp.callback.address=http://consumer-control-plane:8082/protocol

web.http.port=8080
web.http.path=/api
web.http.management.port=8081
web.http.management.path=/management
web.http.management.auth.type=tokenbased
web.http.management.auth.context=management-api
web.http.protocol.port=8082
web.http.protocol.path=/protocol
web.http.control.port=8083
web.http.control.path=/control

edc.datasource.default.url=jdbc:postgresql://postgres:5432/consumer_cp
edc.datasource.default.user=edc
edc.datasource.default.driverClassName=org.postgresql.Driver
edc.sql.schema.autocreate=true

edc.transfer.send.retry.limit=3
edc.transfer.send.retry.base-delay.ms=500
edc.transfer.state-machine.iteration-wait-millis=100
edc.negotiation.send.retry.limit=3
edc.negotiation.send.retry.base-delay.ms=500
edc.negotiation.state-machine.iteration-wait-millis=100
edc.data.plane.selector.state-machine.iteration-wait-millis=100
