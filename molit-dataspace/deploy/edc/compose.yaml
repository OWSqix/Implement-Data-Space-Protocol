name: molit-edc

x-edc-healthcheck: &edc-healthcheck
  test: ["CMD", "java", "-cp", "/opt/edc/runtime.jar", "org.eclipse.edc.molit.health.HttpHealthProbe", "http://localhost:8080/api/check/readiness"]
  interval: 5s
  timeout: 3s
  retries: 40
  start_period: 20s

x-edc-common: &edc-common
  restart: unless-stopped
  networks: [edc-internal]
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: edc
      POSTGRES_PASSWORD: ${EDC_POSTGRES_PASSWORD:?set EDC_POSTGRES_PASSWORD}
      POSTGRES_DB: edc
    volumes:
      - edc-postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edc -d edc"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks: [edc-internal]
    security_opt:
      - no-new-privileges:true

  provider-control-plane:
    <<: *edc-common
    build:
      context: .
      dockerfile: Dockerfile
      target: control-plane
    environment:
      EDC_FS_CONFIG: /etc/edc/provider-control-plane.properties
      EDC_DATASOURCE_DEFAULT_PASSWORD: ${EDC_POSTGRES_PASSWORD:?set EDC_POSTGRES_PASSWORD}
      WEB_HTTP_MANAGEMENT_AUTH_KEY: ${PROVIDER_API_KEY:?set PROVIDER_API_KEY}
    volumes:
      - ./config/provider-control-plane.properties:/etc/edc/provider-control-plane.properties:ro
    ports:
      - "127.0.0.1:19191:8081"
      - "127.0.0.1:19292:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *edc-healthcheck

  provider-data-plane:
    <<: *edc-common
    build:
      context: .
      dockerfile: Dockerfile
      target: data-plane
    environment:
      EDC_FS_CONFIG: /etc/edc/provider-data-plane.properties
      EDC_DATASOURCE_DEFAULT_PASSWORD: ${EDC_POSTGRES_PASSWORD:?set EDC_POSTGRES_PASSWORD}
    volumes:
      - ./config/provider-data-plane.properties:/etc/edc/provider-data-plane.properties:ro
    depends_on:
      postgres:
        condition: service_healthy
      provider-control-plane:
        condition: service_healthy
    healthcheck: *edc-healthcheck

  consumer-control-plane:
    <<: *edc-common
    build:
      context: .
      dockerfile: Dockerfile
      target: control-plane
    environment:
      EDC_FS_CONFIG: /etc/edc/consumer-control-plane.properties
      EDC_DATASOURCE_DEFAULT_PASSWORD: ${EDC_POSTGRES_PASSWORD:?set EDC_POSTGRES_PASSWORD}
      WEB_HTTP_MANAGEMENT_AUTH_KEY: ${CONSUMER_API_KEY:?set CONSUMER_API_KEY}
    volumes:
      - ./config/consumer-control-plane.properties:/etc/edc/consumer-control-plane.properties:ro
    ports:
      - "127.0.0.1:29191:8081"
      - "127.0.0.1:29292:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *edc-healthcheck

  consumer-data-plane:
    <<: *edc-common
    build:
      context: .
      dockerfile: Dockerfile
      target: data-plane
    environment:
      EDC_FS_CONFIG: /etc/edc/consumer-data-plane.properties
      EDC_DATASOURCE_DEFAULT_PASSWORD: ${EDC_POSTGRES_PASSWORD:?set EDC_POSTGRES_PASSWORD}
    volumes:
      - ./config/consumer-data-plane.properties:/etc/edc/consumer-data-plane.properties:ro
    depends_on:
      postgres:
        condition: service_healthy
      consumer-control-plane:
        condition: service_healthy
    healthcheck: *edc-healthcheck

  provider-backend:
    image: nginx:1.30.3-alpine3.23@sha256:0d3b80406a13a767339fbe2f41406d6c7da727ab89cf8fae399e81f780f814d1
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/data.json:/usr/share/nginx/html/data.json:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=8m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/data.json"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    networks: [edc-internal]
    security_opt:
      - no-new-privileges:true

volumes:
  edc-postgres:

networks:
  edc-internal:
    driver: bridge
